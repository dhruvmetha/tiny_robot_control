# Object definitions for ArUco-based detection
# =============================================
# This is the SINGLE SOURCE OF TRUTH for all object definitions.
# Used by: test_push.py, test_robot.py, Runtime, SimEnvironment, NAMO integration
#
# Naming convention:
#   obj_<marker_id>  - Movable objects (markers 1-8)
#   wall_<marker_id> - Static walls (markers 9-15)
#   goal             - Goal marker (marker 0)
#
# Dimension convention (matching MuJoCo/namo_cpp):
#   depth = X dimension (along marker heading when theta=0)
#   width = Y dimension (perpendicular to marker heading)
#
# ArUco dictionaries:
#   Goal/Objects/Walls: DICT_6X6_50
#   Robot: DICT_4X4_50 (configured in real.yaml)

# Marker size for pose estimation (must match your printed markers)
marker_size_mm: 30.0

objects:
  # ─────────────────────────────────────────────────────────────
  # GOAL (marker 0)
  # ─────────────────────────────────────────────────────────────
  goal:
    marker_id: 0
    type: goal

  # ─────────────────────────────────────────────────────────────
  # MOVABLE OBJECTS (markers 1-8)
  # ─────────────────────────────────────────────────────────────



  # Rectangular block - 12cm x 4cm (the push test block)
  obj_1:
    marker_id: 5
    type: movable
    shape:
      width: 15   # cm (Y - perpendicular to heading)
      depth: 7.0    # cm (X - along heading)
      height: 4.0   # cm
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  # 5cm cube
  obj_2:
    marker_id: 6
    type: movable
    shape:
      width: 12.5    # cm (Y)
      depth: 5.0    # cm (X)
      height: 5.0   # cm

  # 5cm cubes
  obj_3:
    marker_id: 7
    type: movable
    shape:
      width: 12.5    # cm (Y)
      depth: 5.0    # cm (X)
      height: 5.0   #

  obj_4:
    marker_id: 8
    type: movable
    shape:
      width: 12.0
      depth: 7.5
      height: 5.0

  obj_5:
    marker_id: 2
    type: movable
    shape:
      width: 16.5
      depth: 4.0
      height: 5.0

  # obj_6:
  #   marker_id: 6
  #   type: movable
  #   shape:
  #     width: 5.0
  #     depth: 5.0
  #     height: 5.0

  # obj_7:
  #   marker_id: 7
  #   type: movable
  #   shape:
  #     width: 5.0
  #     depth: 5.0
  #     height: 5.0

  # obj_8:
  #   marker_id: 8
  #   type: movable
  #   shape:
  #     width: 5.0
  #     depth: 5.0
  #     height: 5.0

  # ─────────────────────────────────────────────────────────────
  # STATIC WALLS (markers 9-15)
  # ─────────────────────────────────────────────────────────────

  # Long wall blocks - 19cm x 5.2cm
  # Use marker_offset if marker is not centered on the object
  wall_9:
    marker_id: 9
    type: static
    shape:
      width: 5.5   # cm (Y)
      depth: 19.0   # cm (X)
      height: 10.0  # cm
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  wall_10:
    marker_id: 10
    type: static
    shape:
      width: 19.5
      depth: 5.5
      height: 10.0
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  wall_11:
    marker_id: 11
    type: static
    shape:
      width: 19.5
      depth: 5.5
      height: 10.0
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  wall_12:
    marker_id: 12
    type: static
    shape:
      width: 19.5
      depth: 5.5
      height: 10.0

# Object definitions for ArUco-based detection
# =============================================
# This is the SINGLE SOURCE OF TRUTH for all object definitions.
# Used by: test_push.py, test_robot.py, Runtime, SimEnvironment, NAMO integration
#
# Naming convention:
#   obj_<label>      - Movable objects; marker_id is assigned explicitly
#   wall_<marker_id> - Static walls; type is assigned explicitly
#   goal             - Goal marker (marker 0)
#
# Dimension convention (matching MuJoCo/namo_cpp):
#   depth = X dimension (along marker heading when theta=0)
#   width = Y dimension (perpendicular to marker heading)
#
# ArUco dictionaries:
#   Goal/Objects/Walls: DICT_6X6_50
#   Robot: DICT_4X4_50 (configured in real.yaml)

# Marker size for pose estimation (must match your printed markers)
marker_size_mm: 30.0

objects:
  # ─────────────────────────────────────────────────────────────
  # GOAL (marker 0)
  # ─────────────────────────────────────────────────────────────
  goal:
    marker_id: 0
    type: goal

  # ─────────────────────────────────────────────────────────────
  # MOVABLE OBJECTS
  # ─────────────────────────────────────────────────────────────



  # Rectangular block - 12cm x 4cm (the push test block)
  obj_1:
    marker_id: 5
    type: movable
    shape:
      width: 15   # cm (Y - perpendicular to heading)
      depth: 7.0    # cm (X - along heading)
      height: 4.0   # cm
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  # 5cm cube
  obj_2:
    marker_id: 6
    type: movable
    shape:
      width: 12.5    # cm (Y)
      depth: 5.0    # cm (X)
      height: 5.0   # cm

  # 5cm cubes
  obj_3:
    marker_id: 7
    type: movable
    shape:
      width: 12.5    # cm (Y)
      depth: 5.0    # cm (X)
      height: 5.0   #

  obj_4:
    marker_id: 8
    type: movable
    shape:
      width: 12.0
      depth: 7.5
      height: 5.0

  # Same dimensions as obj_4, per operator instruction 2026-09-09.
  obj_4b:
    marker_id: 4
    type: movable
    shape:
      width: 12.0
      depth: 7.5
      height: 5.0

  obj_5:
    marker_id: 2
    type: movable
    shape:
      width: 16.5
      depth: 4.0
      height: 5.0

  # Square block, measured 2026-09-09.
  obj_6:
    marker_id: 13
    type: movable
    shape:
      width: 12.5
      depth: 12.5
      height: 5.5

  # obj_7:
  #   marker_id: 7
  #   type: movable
  #   shape:
  #     width: 5.0
  #     depth: 5.0
  #     height: 5.0

  # obj_8:
  #   marker_id: 8
  #   type: movable
  #   shape:
  #     width: 5.0
  #     depth: 5.0
  #     height: 5.0

  # ─────────────────────────────────────────────────────────────
  # STATIC WALLS
  # ─────────────────────────────────────────────────────────────

  # Long wall blocks - 19cm x 5.2cm
  # Use marker_offset if marker is not centered on the object

  # wall_9's width/depth look swapped next to wall_10 and wall_11, and they are.
  # Its ArUco tag is glued on 90 degrees rotated from theirs, so the swap here
  # cancels that out and the world-frame box comes out correct. Verified
  # 2026-08-22 against the scene XML from a real run: wall_9 reports theta 6 and
  # draws horizontal, wall_11 reports theta 92 and also draws horizontal. Do not
  # "fix" this to match the other two. That was tried on 2026-08-21 and nav
  # started drawing wall_9 vertical.
  wall_9:
    marker_id: 9
    type: static
    shape:
      width: 5.5   # cm (Y)
      depth: 19.0   # cm (X)
      height: 10.0  # cm
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  wall_10:
    marker_id: 10
    type: static
    shape:
      width: 19.5
      depth: 5.5
      height: 10.0
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  wall_11:
    marker_id: 11
    type: static
    shape:
      width: 19.5
      depth: 5.5
      height: 10.0
    marker_offset:
      x: 0
      y: 0       # marker is 7cm right of wall center

  wall_12:
    marker_id: 12
    type: static
    shape:
      width: 19.5
      depth: 5.5
      height: 10.0

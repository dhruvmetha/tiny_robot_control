# Real environment configuration
# Robot and object marker definitions

# Camera settings
camera:
  device: 4      # RealSense color stream (/dev/video4, YUYV). Other RealSense devices: video0=depth(Z16), video2=IR(greyscale), video1/3/6=metadata. NOTE: index can shift across reboots/replug — verify with `v4l2-ctl --list-formats-ext -d /dev/videoN`.
  resolution: "720p"
  fps: 60
  # Path to camera calibration file (camera matrix K and distortion D)
  # If empty, uses default approximation
  calibration_file: ""
  # Camera exposure (-6 is typical for ArUco detection, null for auto)
  exposure: -6
  # Apply undistortion to frames before processing (requires calibration)
  undistort: false

# Robot marker (4x4 ArUco)
robot:
  marker_id: 1
  marker_size_mm: 36.0
  # Robot dimensions in cm (for 2D footprint / planner)
  # 7×7 robot footprint (0.5 cm safety buffer over physical 6×6 cm).
  # The wavefront uses rotation-safe radius √(3.5²+3.5²) ≈ 4.95 cm.
  # Must stay in sync with namo_cpp robot_size config = [0.21, 0.21].
  width_cm: 7   # side-to-side
  height_cm: 7  # front-to-back (depth)
  # Offset from marker center to wheel center [x_cm, y_cm] in marker-local coords
  # Use if the ArUco marker is not placed at the robot's center of rotation
  # Positive x = forward, positive y = left
  marker_to_wheel_offset: [0.0, 0.0]

# Object markers (6x6 ArUco)/
# Object definitions are in config/objects.yaml (single source of truth)
# This sets the marker size for pose estimation
object_marker_size_mm: 30.0

# Workspace settings
workspace:
  width_cm: 49.0
  height_cm: 77.5
  # Origin offset from physical corner [x_cm, y_cm]
  origin_offset: [4.9, 6.0]
  warmup_frames: 30
  min_inliers: 12

# Serial port settings (for SerialActionSender)
serial:
  port: "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:51:DB:18:34:7C-if00"
  baudrate: 115200
  send_hz: 30.0
  invert_right_wheel: false

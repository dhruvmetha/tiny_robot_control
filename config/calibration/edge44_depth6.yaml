# Tick-count calibration for edge 44 (right face center, sample 7), depth 6.
# push_steps=7 = 7 NAMO units per trial. Sweep happens by editing
# config/controller.yaml: push.push_steps between runs (current value: 26).
#
# ONE trial per invocation: re-run this same spec 10 times with a different
# --run-name each time (trial1, trial2, ...). Use --no-reset-check so the
# push fires from wherever the object currently is.
#
# obstacle_target is set at session start but ignored when --no-reset-check
# is passed. Push direction is +Y in world (~270° object theta). Expected
# travel ~16 cm (extrapolated from depth-9 mean of 22.68 cm / 10 * 7).

obstacle_target: [15.62, 20.01]
reset_tolerance_cm: 3.0

trials:
  - {edge_idx: 44, push_steps: 7}

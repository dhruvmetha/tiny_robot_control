# Tick-count calibration for edge 14 (top face center, sample 7), depth 9.
# push_steps=10 = 10 NAMO units per trial.
#
# Edge 14 is the top-face center. Object is currently at θ≈181°, so the
# "top face" (object frame +Y) maps to world -Y, meaning push direction
# (edge → center) is +Y in world. Center-face push — expect mostly
# translation with small Δθ (similar character to edge 44 with prior θ).
#
# ONE trial per invocation: re-run with --no-reset-check and bumped trial
# number. obstacle_target ignored when --no-reset-check is set.

obstacle_target: [19.64, 23.70]
reset_tolerance_cm: 3.0

trials:
  - {edge_idx: 14, push_steps: 10}

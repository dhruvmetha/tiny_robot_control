# Tick-count calibration for edge 44 (right face center, sample 7), depth 9.
# push_steps=10 = 10 NAMO units per trial. Sweep happens by editing
# config/controller.yaml: push.push_steps between runs (current value: 26).
#
# ONE trial per invocation: operator physically resets the scene between
# runs. Re-run this same spec 5+ times with a different --run-name each
# time (e.g. ticks26_trial1_..., ticks26_trial2_...).
#
# obstacle_target captured from camera_service at session setup. Push
# direction is +Y in world (~270° object theta). At ~43 cm travel per
# trial, obstacle at y=16.08 has ~57 cm clearance to top wall.

obstacle_target: [19.77, 16.08]
reset_tolerance_cm: 3.0

trials:
  - {edge_idx: 44, push_steps: 10}

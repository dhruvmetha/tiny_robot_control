# Tick-count calibration for obj_4 (marker_id=8, 12x7.5x5 cm) — edge 44, depth 6.
# push_steps=7 = 7 NAMO units per trial.
#
# Edge 44 is the right-face center (sample 7). At the captured θ (~270°),
# push direction is ~pure +Y in world. Center-face push — expect mostly
# translation with small Δθ.
#
# object_id pinned to obj_4.
#
# ONE trial per invocation: re-run with --no-reset-check and bumped trial
# number. obstacle_target ignored when --no-reset-check is set.

obstacle_target: [17.00, 20.64]
reset_tolerance_cm: 3.0

trials:
  - {object_id: obj_4, edge_idx: 44, push_steps: 7}

# Tick-count calibration for obj_4 (marker_id=8, 12x7.5x5 cm) — edge 1, depth 6.
# push_steps=7 = 7 NAMO units per trial.
#
# Edge 1 is the bottom-face corner (sample 0). Push direction is edge→center,
# a diagonal: ~+0.55 X, ~+0.84 Y in world frame at the captured θ (~0°).
#
# object_id pinned to obj_4.
#
# ONE trial per invocation: re-run with --no-reset-check and bumped trial
# number. obstacle_target ignored when --no-reset-check is set.

obstacle_target: [19.07, 22.61]
reset_tolerance_cm: 3.0

trials:
  - {object_id: obj_4, edge_idx: 1, push_steps: 7}

# Trial spec for scripts/collect_real_primitives.py.
#
# 60 trials, 20 distinct edges, 3 depths per edge (random order from {1,3,5}).
# Coverage:
#   - All 8 corner edges: 0, 1, 28, 29, 30, 31, 58, 59
#     (sample 0 and sample 14 on each of the 4 faces — each physical corner
#     of the rectangle is approached from BOTH adjacent faces, giving two
#     different push directions for the same contact point).
#   - 12 random non-corner edges across the 4 faces (seed=42).
#
# edge_idx layout (points_per_face=15):
#   0..29  top/bot pairs (even=top/+Y, odd=bot/-Y), sample = idx // 2
#   30..59 right/left pairs (even within=right/+X, odd=left/-X), sample = (idx-30) // 2
#   Push direction is edge → object mid (toward the opposite face).

obstacle_target: [25.0, 35.0]
reset_tolerance_cm: 3.0

trials:

  # edge 0 (top sample 0 [CORNER])
  - {edge_idx:  0, push_steps:  3}
  - {edge_idx:  0, push_steps:  1}
  - {edge_idx:  0, push_steps:  5}

  # edge 1 (bot sample 0 [CORNER])
  - {edge_idx:  1, push_steps:  1}
  - {edge_idx:  1, push_steps:  5}
  - {edge_idx:  1, push_steps:  3}


# Manual two-push solution for env1 (1push / 2hop).
# Each trial specifies which object to push; the script honors trial["object_id"]
# (execute_real_push.py:887). Depth → push_steps = depth + 1 internally.
#
# obstacle_target / reset_tolerance_cm are ignored when --no-reset-check is set,
# but kept here so the YAML is also valid for a reset-checking run later.

obstacle_target: [0.0, 0.0]
reset_tolerance_cm: 3.0

trials:
  - {object_id: obj_1, edge_idx: 14, depth: 8}
  - {object_id: obj_4, edge_idx: 45, depth: 5}

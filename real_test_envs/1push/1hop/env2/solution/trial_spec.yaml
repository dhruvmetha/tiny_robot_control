# Manual one-push solution for env2 (1push / 1hop).
# Depth = recursion depth in search; the script converts to push_steps = depth + 1
# internally (see execute_real_push.py: trial["depth"] branch).
#
# obstacle_target / reset_tolerance_cm are ignored when --no-reset-check is set,
# but kept here so the YAML is also valid for a reset-checking run later.

obstacle_target: [0.0, 0.0]
reset_tolerance_cm: 3.0

trials:
  - {edge_idx: 28, depth: 5}
